analise:
  agrupar_por_embalagem: true
  agrupar_por_sku: true
  top_n_combinations: 20
dados:
  ano_custo: 2025
  ano_preco: 2025
  estab_custo: 100
  estab_preco: 100
  estabelecimentos:
  - 100
  mes_custo: 11
  mes_preco: 11
  meses_janela_custo: 6
  meses_janela_preco: 6
  percentil_inferior_preco: 1
  percentil_superior_preco: 99
  remover_outliers_preco: true
  semana_ref: 2025-51
  sku_minimo_transacoes: 1
  tipo_estoque: DISPONIVEL PARA VENDA
debug:
  ativar: false
  limitar_skus: null
  salvar_modelo_lp: false
  salvar_modelo_mps: false
  seed_random: 42
meta:
  autor: 7D
  changelog:
  - '2025-12-08: Versão inicial - mix diário sem clientes'
  data_criacao: '2025-12-08'
  descricao: Modelo de otimização de mix diário (SKU x Embalagem) sem clientes
  versao_modelo: '1.0'
modelo:
  atender_pedidos: false
  considerar_demanda_historica: true
  escoar_todo_estoque: true
  fator_expansao_demanda: 5
  fator_percentual_maximo: 1.2
  granularidade_demanda: S
  limite_realocacao: 2.5
  maximizar_margem_absoluta: true
  percentil_demanda: 95
  periodo_historico_meses: 12
  tipo_calculo_demanda: media
  tipo_objetivo: maximizar_margem
  usar_apenas_excedente: false
  variaveis_continuas: true
negocio:
  filtrar_granjas:
  - '100'
  filtrar_skus_margem_negativa: true
  margem_minima_percentual: 0.0
paths:
  classes: inputs/base_skus_classes.xlsx
  custos: inputs/MANTI-PRIC_Custos_12012026.parquet
  estab_corrigido: inputs/ESTAB CORRIGIDO.xlsx
  faturamento: inputs/manti_fat_2025_full.parquet
  logs_dir: logs
  output_dir: resultados
  pedidos: inputs/pedidos_clientes.csv
  precos: inputs/precos_sku_embalagem.csv
  producao: inputs/producao_classe.csv
  producao_bruta: inputs/PRODUÇÃO DIA.xlsx
  skus_restritos: inputs/skus_restritos.xlsx
solver:
  dual_tolerance: 1.0e-07
  gap_percentage: 0.001
  num_threads: 4
  primal_tolerance: 1.0e-07
  solver_type: SCIP_MIXED_INTEGER_PROGRAMMING
  time_limit_ms: 600000
  time_limit_seconds: 600
  verbose: true
