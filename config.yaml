# ==============================================================================
# CONFIGURAÇÃO DO MODELO DE OTIMIZAÇÃO DE MIX
# ==============================================================================

# --- Dados de entrada ---
dados:
  # Ano e mês de referência para custo, preço e demanda histórica
  ano_custo: 2026
  ano_preco: 2026
  mes_custo: 3                    # Mês final da janela de referência
  mes_preco: 3                    # Mês final da janela de preços
  meses_janela_custo: 6           # Janela em meses para cálculo de custo e demanda histórica
  meses_janela_preco: 6           # Janela em meses para cálculo de preço médio
  # Estabelecimentos
  estab_custo: 410                # Estabelecimento para busca de custos
  estab_preco: 410                # Estabelecimento para busca de preços
  estabelecimentos:               # Lista de estabelecimentos a considerar
  - 410
  # Filtros de preço
  percentil_inferior_preco: 1     # Percentil inferior para remoção de outliers de preço
  percentil_superior_preco: 99    # Percentil superior para remoção de outliers de preço
  remover_outliers_preco: true    # Ativa remoção de outliers no cálculo de preço médio
  # Outros filtros
  semana_ref: 2026-10             # Semana de referência para produção (usado quando granularidade = S)
  data_ref: '2026-03-03'          # Data de referência para produção (usado quando granularidade = D ou M)
  # Referências independentes para PEDIDOS (granularidade segue modelo.granularidade_demanda)
  pedidos_semana_ref: 2026-11     # Referência semanal para pedidos (usado quando granularidade = S)
  pedidos_data_ref: '2026-03-11'  # Referência diária/mensal para pedidos (usado quando granularidade = D ou M)
  # Distribuição histórica por dia da semana (DOW) - usada apenas quando granularidade = S
  # Se não informados, o código faz fallback para ano_custo/mes_custo/meses_janela_custo
  dow_ano_ref: 2026               # Ano de referência da janela histórica DOW
  dow_mes_ref: 3                  # Mês final da janela histórica DOW
  dow_meses_janela: 6             # Janela em meses para cálculo do perfil DOW
  sku_minimo_transacoes: 1        # Mínimo de transações para considerar um SKU
  tipo_estoque: DISPONIVEL PARA VENDA  # Tipo de estoque a filtrar

# --- Parâmetros do modelo de otimização ---
modelo:
  # Pedidos e produção
  atender_pedidos: true           # Reserva volume para pedidos garantidos antes de otimizar
  usar_apenas_excedente: true     # Otimiza apenas o excedente (produção - pedidos)
  capar_reserva_na_producao: true  # Limita reserva à produção, priorizando SKUs de maior margem
  # Demanda histórica (restrição de alocação máxima por SKU)
  considerar_demanda_historica: true  # Ativa limite de alocação por SKU baseado no histórico
  tipo_calculo_demanda: maximo    # Tipo de cálculo: media | maximo | percentil
  fator_demanda_maxima: 1.2       # Multiplicador sobre a demanda calculada (1.2 = 120% da demanda)
  percentil_demanda: 95           # Percentil a usar (só quando tipo_calculo_demanda = percentil)
  granularidade_demanda: S        # Granularidade: S(emanal) | M(ensal) | D(iário)
  # Função objetivo
  tipo_objetivo: maximizar_margem # Objetivo: maximizar_margem | minimizar_custos
  # Variáveis de decisão
  variaveis_continuas: true       # true=NumVar (frações), false=IntVar (quantidades inteiras)

# --- Regras de negócio ---
negocio:
  filtrar_granjas:                # Estabelecimentos a considerar na demanda histórica
  - '410'

# --- Caminhos dos arquivos ---
paths:
  classes: inputs/base_skus_classes.xlsx
  custos: inputs/MANTI-PRIC_Custos.parquet
  estab_corrigido: inputs/ESTAB CORRIGIDO.xlsx
  faturamento: inputs/manti_fat_.parquet
  logs_dir: logs
  output_dir: resultados
  carteira_vendida: inputs/CARTEIRA_VENDIDA.xlsx
  pedidos: inputs/pedidos_clientes.csv
  precos: inputs/precos_sku_embalagem.csv
  producao: inputs/producao_classe.csv
  producao_bruta: inputs/PRODUÇÃO DIA.xlsx
  skus_restritos: inputs/skus_restritos.xlsx

# --- Fallbacks operacionais (usados apenas em cenários extremos) ---
fallbacks:
  custo_medio_geral: 132.82         # Usado quando não há custo válido na base do ETL
  qtd_ovos_por_caixa: 360           # Referência de embalagem para fallback de custo

# --- Configuração do solver (OR-Tools) ---
solver:
  solver_type: SCIP_MIXED_INTEGER_PROGRAMMING  # Tipo de solver (SCIP para inteiro/misto, GLOP para linear)
  time_limit_ms: 600000           # Tempo máximo de resolução em milissegundos (600s = 10min)
  num_threads: 4                  # Número de threads para resolução paralela
  verbose: true                   # Exibe output detalhado do solver
  gap_percentage: 0.001           # Gap de otimalidade (0.001 = 0.1%) - SCIP only
  dual_tolerance: 1.0e-07         # Tolerância dual (precisão numérica) - SCIP only
  primal_tolerance: 1.0e-07       # Tolerância primal (precisão numérica) - SCIP only
